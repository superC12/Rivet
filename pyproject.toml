[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rivet-orchestrator"
version = "2.1.0"
description = "A lightweight, self-hosted AI orchestration dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rivet contributors" }]
keywords = ["ai", "ollama", "openrouter", "homelab", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
rivet = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/superC12/Rivet"
Repository = "https://github.com/superC12/Rivet.git"
Issues = "https://github.com/superC12/Rivet/issues"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
