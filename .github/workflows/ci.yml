name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q backend tests
      - name: Test
        run: python -m pytest
      - name: Check installer syntax
        run: bash -n install.sh scripts/rivet-server scripts/uninstall.sh
      - name: Build Docker image
        run: docker build --tag rivet:ci .
