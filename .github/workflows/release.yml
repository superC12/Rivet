name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest
          bash -n install.sh scripts/rivet-server scripts/uninstall.sh
      - name: Build release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='data/*.db*' \
            -czf "$RUNNER_TEMP/rivet.tar.gz" .
          mv "$RUNNER_TEMP/rivet.tar.gz" rivet.tar.gz
          sha256sum rivet.tar.gz > rivet.tar.gz.sha256
      # Runs after the archive is built so the notes file is not sealed
      # inside the tarball it describes.
      - name: Extract release notes from the changelog
        run: |
          python - "${GITHUB_REF_NAME}" > release-notes.md <<'PY'
          import pathlib, re, sys

          version = re.escape(sys.argv[1].lstrip("v"))
          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8") if changelog.is_file() else ""
          match = re.search(rf"^## \[{version}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          sys.stdout.write(match.group(1).strip() if match else "")
          PY
          if [[ -s release-notes.md ]]; then
            echo "Using the CHANGELOG.md section for ${GITHUB_REF_NAME}."
          else
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; generating notes from commits."
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s release-notes.md ]]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" rivet.tar.gz rivet.tar.gz.sha256 \
            --title "Rivet ${GITHUB_REF_NAME}" --verify-tag "${notes[@]}"
