name: Feature request
description: Suggest a focused addition to Rivet's orchestration layer
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What orchestration problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing integrations or alternatives
      description: Could this be handled by Ollama, n8n, Tailscale, or another external module instead?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps Rivet lightweight and does not rebuild a full external application.
          required: true
