name: Bug report
description: Report a reproducible problem in Rivet
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Rivet. Remove API keys, prompts, and conversation content from logs before attaching them.
  - type: input
    id: version
    attributes:
      label: Rivet version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Ubuntu installer
        - Docker Compose
        - Manual Python installation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Never include secrets, full sensitive prompts, or personal conversation data.
      render: shell
