services:
  rivet:
    build: .
    container_name: rivet
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3
